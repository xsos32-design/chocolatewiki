 var L=R.filter(base);L.forEach(function(r){r._f=fit(r)});
 var C=combos(L),ce=document.getElementById('combos');
 ce.innerHTML=C.length?C.map(function(cb){return '<div class="cb"><div class="lab"><span>'+esc(cb.lab)+'</span><div class="tot">'+nt(cb.tot)+'<s>'+nt(cb.sum)+'</s></div></div><div class="sv">比單買省 '+nt(cb.sum-cb.tot)+'</div><ul>'+cb.it.map(function(r){return '<li><a href="./#'+encodeURIComponent(r.i)+'"><span class="ph"'+(r.g?' style="background-image:url(\''+esc(r.g)+'\')"':'')+'></span><span class="t">'+esc(r.n)+'<i>'+esc([r.no,nt(r.p)].filter(Boolean).join('・'))+'</i></span></a></li>'}).join('')+'</ul></div>'}).join(''):'<div class="empty">'+(ENDED?'活動結束，暫無組合。':'這個條件下湊不出折扣組合，放寬預算或類別試試。')+'</div>';
 var b=BUD[st.bud];
 var S=L.filter(function(r){var p=price(r);return !st.bud||(p&&p>=b[1]&&p<=b[2])||(!p&&!st.bud)});
 var SO={fit:function(a,c){return c._f-a._f||(price(a)||9e9)-(price(c)||9e9)},promo:function(a,c){return (RT[a.k]?RT[a.k][0]:1)-(RT[c.k]?RT[c.k][0]:1)||c._f-a._f},asc:function(a,c){return (price(a)||9e9)-(price(c)||9e9)},desc:function(a,c){return price(c)-price(a)}};
 S.sort(SO[st.sort]);
 document.getElementById('cnt').textContent=S.length;
 var el=document.getElementById('list');
 if(!S.length){el.innerHTML='<div class="empty">沒有符合的商品，放寬一個條件試試。</div>';document.getElementById('more').hidden=true;return}
 el.innerHTML=S.slice(0,st.show).map(function(r){
  var tg=r.w.map(function(w){return '<span>'+esc(P.who[w])+'</span>'}).join('')+r.t.map(function(t){return '<span>'+esc(P.taste[t])+'</span>'}).join('');
  var pr=r.s?'單一促銷價 '+nt(r.s)+(ENDED?'':''):(r.p?nt(r.p):'售價請看價卡');
  return '<a class="card" href="./#'+encodeURIComponent(r.i)+'"><div class="ph"'+(r.g?' style="background-image:url(\''+esc(r.g)+'\')"':'')+'></div><div class="tx"><div class="nm">'+esc(r.n)+'</div><div class="mt">'+esc([r.no,r.b,r.c,r.sp].filter(Boolean).join('・'))+'</div>'+(r.q?'<div class="q">'+esc(r.q)+'</div>':'')+'<div class="pr">'+(ENDED&&r.s?(r.p?nt(r.p):'售價請看價卡'):pr)+'</div>'+(!ENDED&&r.m&&!r.s?'<span class="pm">'+esc(r.m)+'</span>':'')+(tg?'<div class="tg">'+tg+'</div>':'')+'</div></a>'}).join('');
 document.getElementById('more').hidden=S.length<=st.show;
}
document.getElementById('sort').onchange=function(){st.sort=this.value;draw()};
document.getElementById('more').onclick=function(){st.show+=24;draw()};
draw();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
